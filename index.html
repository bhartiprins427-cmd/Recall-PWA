<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123456">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<title>Recall</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#123456;--steel:#4682B4;--denim:#79BAEC;--berry:#0041C2;--s1:#1a4472;--s2:#1f4f82;--n:#79BAEC;--l:#ff8a80;--d:#4ade80}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#000;font-family:'Montserrat',system-ui,sans-serif;color:#fff;display:flex;justify-content:center}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--denim);outline-offset:2px}
.app{width:100%;max-width:430px;height:100%;background:var(--deep);display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0)}
@media(min-width:500px){body{align-items:center}.app{height:min(860px,96vh);border-radius:28px;border:1px solid #1b2a3c;overflow:hidden}}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 18px 6px;flex:none}
.logo{width:40px;height:40px;border-radius:12px;background:var(--berry);display:grid;place-items:center}
.brand{font-weight:700;font-size:20px}
.pill{margin-left:auto;font-size:12px;font-weight:600;color:#22c55e;background:rgba(34,197,94,.14);padding:6px 12px;border-radius:99px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:active{background:var(--s1)}
#v{flex:1;min-height:0;display:flex;flex-direction:column}
.pad{flex:1;overflow-y:auto;padding:8px 18px 18px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--s1);border-radius:18px;padding:16px}
h1{font-size:26px;font-weight:700;line-height:1.15;margin-bottom:6px}
h2{font-size:17px;font-weight:700}
.mu{color:var(--denim);font-size:14px;font-weight:500;line-height:1.45}
.pb{height:6px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:12px;overflow:hidden}.pb i{display:block;height:100%;background:var(--denim)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--s2);border-radius:16px;padding:16px}.stat b{display:block;font-size:30px;line-height:1.1;margin-bottom:12px}.stat span{font-size:14px;color:var(--denim);font-weight:500}
.btn{background:var(--s2);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.btn.p{background:var(--berry)}.btn.r{background:#7a2230}
.big{width:100%;background:var(--berry);border-radius:14px;padding:16px;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}
.big:active,.btn.p:active{background:#0036a3}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dw{flex:1;min-height:0;padding:12px 18px 10px;display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.lg{font-size:12px;font-weight:600;display:flex;gap:10px}
.n{color:var(--n)}.l{color:var(--l)}.d{color:var(--d)}.z{opacity:.35}
.dl{flex:1;min-height:0;overflow-y:auto;background:var(--s1);border-radius:18px;padding:6px;scrollbar-width:thin;scrollbar-color:var(--steel) transparent}
.deck{display:flex;align-items:center;gap:8px;padding:13px 10px;border-radius:12px;cursor:pointer;border-bottom:1px solid rgba(121,186,236,.12)}
.deck:active{background:var(--s2)}
.chev{width:22px;height:22px;flex:none;color:var(--denim);display:grid;place-items:center;transition:transform .2s}.chev.o{transform:rotate(90deg)}
.name{flex:1;font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counts{display:flex;gap:12px;font-size:14px;font-weight:700;flex:none}
.empty{padding:28px 16px;text-align:center}.empty p{margin-bottom:14px}
input,select,textarea{width:100%;background:var(--deep);border:1px solid var(--steel);border-radius:12px;padding:11px 12px;font-size:15px}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--denim);margin:10px 0 4px}
.cr{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid rgba(121,186,236,.12);cursor:pointer}
.cr div{flex:1;min-width:0}.cr b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cr small{color:var(--denim);font-size:12px}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(121,186,236,.18);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--steel);font-size:11px;font-weight:600}
.nav [aria-current=page]{color:#fff}.nav [aria-current=page] svg{color:var(--denim)}
.st .nav,.st .topbar{display:none}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:9px;color:var(--denim);gap:3px}
.bars i{width:100%;background:var(--steel);border-radius:4px 4px 0 0;min-height:2px}
.tr{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(121,186,236,.12);font-size:14px}.tr b{font-weight:700}
/* study */
.sh{display:flex;align-items:center;gap:12px;padding:16px 18px 6px}
.sb{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}.sb i{display:block;height:100%;background:var(--denim);transition:width .3s}
.cw{flex:1;padding:14px 18px;perspective:1200px;min-height:0}
.c3{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.c3.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--s1);border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;overflow-y:auto;font-size:22px;font-weight:600;line-height:1.35;white-space:pre-wrap}
.face.bk{transform:rotateY(180deg);background:var(--s2)}
.face img{max-width:100%;max-height:160px;border-radius:12px}
.face small{font-size:14px;font-weight:500;color:var(--denim)}
.face .btn,.face input{font-size:15px;font-weight:600}.face .row{justify-content:center}.face code{background:rgba(0,0,0,.3);padding:1px 6px;border-radius:6px;font-size:.85em}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:10px}.hm i{aspect-ratio:1;border-radius:3px}
.ra{padding:6px 18px calc(18px + env(safe-area-inset-bottom,0));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:none}
.ra button{border-radius:14px;padding:12px 4px;font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:3px}.ra small{font-size:11px;font-weight:500;opacity:.85}
.ra .sa{grid-column:1/-1;background:var(--berry);font-size:18px;padding:16px;flex-direction:row;justify-content:center}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{width:100%;max-width:430px;max-height:92vh;overflow-y:auto;background:var(--deep);border:1px solid var(--steel);border-radius:22px 22px 0 0;padding:18px}
.sheet h2{margin-bottom:6px}
</style>
</head>
<body>
<main class="app" id="app">
<header class="topbar"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.3L20 9l-4.3 3.9L17 19l-5-3-5 3 1.3-6.1L4 9l5.8-.7z"/></svg></div><span class="brand">Recall</span><span class="pill" id="pill"></span><button class="ib" data-a="set" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></header>
<div id="v"></div>
<nav class="nav">
<button data-a="go" data-t="home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>
<button data-a="go" data-t="stats"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Stats</button>
<button data-a="go" data-t="decks"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 7V5a2 2 0 012-2h10a2 2 0 012 2v10a2 2 0 01-2 2h-2"/></svg>Decks</button>
<button data-a="go" data-t="profile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Profile</button>
</nav>
</main>
<div id="m"></div>
<input type="file" id="fi" hidden>
<script>
const $=s=>document.querySelector(s),D=864e5,M=6e4;
// ---------- FSRS-5 core (default parameters) ----------
const W=[.40255,1.18385,3.173,15.69105,7.1949,.5345,1.4604,.0046,1.54575,.1192,1.01925,1.9395,.11,.29605,2.2698,.2315,2.9898,.51655,.6621],F=19/81;
const cl=(x,a,b)=>Math.min(b,Math.max(a,x)),R=(t,s)=>Math.pow(1+F*t/s,-.5),IV=(s,r)=>Math.max(1,Math.round(s/F*(Math.pow(r,-2)-1)));
const d0=g=>W[4]-Math.exp(W[5]*(g-1))+1,nd=(d,g)=>cl(W[7]*d0(4)+(1-W[7])*(d-W[6]*(g-3)*(10-d)/9),1,10);
const sr=(d,s,r,g)=>s*(1+Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp((1-r)*W[10])-1)*(g==2?W[15]:1)*(g==4?W[16]:1));
const sf=(d,s,r)=>Math.min(s,W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp((1-r)*W[14]));
// states: 0 new, 1 learning, 2 review, 3 relearning
function sched(c,g,now){const f={...c.f},r0=S.set.ret,el=Math.max(0,(now-f.last)/D);f.reps++;f.last=now;let st=f.st;
 const out=()=>{f.st=2;f.step=0;f.iv=IV(f.s,r0);f.due=now+f.iv*D;return f};
 if(st==0){f.s=W[g-1];f.d=cl(d0(g),1,10);f.st=st=1;f.step=0;if(g==4)return out()}
 else if(st==2){const r=R(el,f.s);f.d=nd(c.f.d,g);
  if(g==1){f.s=Math.max(.1,sf(c.f.d,c.f.s,r));f.lapses++;f.st=3;f.step=0;f.due=now+10*M;return f}
  const ss=[2,3,4].map(x=>sr(c.f.d,c.f.s,r,x)),iv=ss.map(s=>IV(s,r0));
  iv[0]=Math.min(iv[0],iv[1]);iv[1]=Math.max(iv[1],iv[0]+1);iv[2]=Math.max(iv[2],iv[1]+1);
  f.s=ss[g-2];f.iv=iv[g-2];f.due=now+f.iv*D;return f}
 const steps=st==3?[10]:[1,10];
 if(g==1)f.step=0;else if(g==3)f.step++;else if(g==4)f.step=steps.length;
 if(f.step>=steps.length)return out();
 f.due=now+steps[f.step]*M;return f}
const lbl=ms=>ms<36e5?Math.max(1,Math.round(ms/M))+'m':ms<D?Math.round(ms/36e5)+'h':ms<30*D?Math.round(ms/D)+'d':ms<365*D?(ms/D/30).toFixed(1)+'mo':(ms/D/365).toFixed(1)+'y';
// ---------- data ----------
const SCHEMA=2;
function migrate(j){j=j||{};j.decks=j.decks||[];j.cards=j.cards||[];j.logs=j.logs||[];j.set={ret:.9,np:20,mx:200,dg:50,wk:300,...(j.set||{})};
 j.cards.forEach(c=>{c.imgs=c.imgs||(c.img?[c.img]:[]);delete c.img;c.tags=c.tags||[];c.extra=c.extra||'';c.hint=c.hint||''});j.v=SCHEMA;return j}
let S=migrate(JSON.parse(localStorage.getItem('recall.v1')||'null'));
const save=()=>{try{localStorage.setItem('recall.v1',JSON.stringify(S))}catch(e){alert('Storage is full. Export a backup and remove images or old cards.')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deck=id=>S.decks.find(d=>d.id==id),card=id=>S.cards.find(c=>c.id==id);
const sod=()=>new Date().setHours(0,0,0,0),eod=()=>new Date().setHours(23,59,59,999);
const kids=id=>S.decks.filter(d=>d.p===id),tree=id=>[id,...kids(id).flatMap(k=>tree(k.id))];
const mk=(deckId,o={})=>({id:uid(),deck:deckId,front:'',back:'',extra:'',hint:'',tags:[],imgs:[],cr:Date.now(),md:Date.now(),...o,f:{st:0,s:0,d:0,due:Date.now(),step:0,last:0,reps:0,lapses:0}});
const newDone=ids=>S.logs.filter(x=>x.st==0&&x.t>=sod()&&ids.has(x.deck)).length;
function cnt(id){const ids=new Set(tree(id)),now=Date.now(),e=eod();let n=0,l=0,u=0;
 S.cards.forEach(c=>{if(!ids.has(c.deck))return;const f=c.f;if(f.st==0)n++;else if(f.st==2){if(f.due<=e)u++}else if(f.due<=now+20*M)l++});
 return[Math.min(n,Math.max(0,(deck(id).np??S.set.np)-newDone(ids))),l,u]}
const tot=()=>S.decks.filter(d=>!d.p).reduce((a,d)=>{const x=cnt(d.id);return a.map((v,i)=>v+x[i])},[0,0,0]);
const dayKey=t=>new Date(t).toLocaleDateString('en-CA');
function streak(){const s=new Set(S.logs.map(x=>dayKey(x.t)));let n=0,t=Date.now();if(!s.has(dayKey(t)))t-=D;while(s.has(dayKey(t))){n++;t-=D}return n}
// ---------- csv / files ----------
function parseCSV(t){const r=[];let row=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','||c=='\t'){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);r.push(row)}return r.filter(x=>x.join('').trim())}
const toCSV=rows=>rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
function pick(cb,accept){const i=$('#fi');i.accept=accept;i.value='';i.onchange=()=>{const f=i.files[0];if(f)cb(f)};i.click()}
// ---------- views ----------
let V={t:'home',id:null,o:new Set(),sort:'name',q:'',tag:''},ST=null,tm=null;
const CH='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const zc=(v,c)=>`<span class="${c}${v?'':' z'}">${v}</span>`;
const sib=p=>S.decks.filter(d=>p?d.p===p:!d.p).sort(V.sort=='due'?(a,b)=>{const x=cnt(a.id),y=cnt(b.id);return y[1]+y[2]-x[1]-x[2]}:(a,b)=>a.name.localeCompare(b.name));
function row(d,dep){const[n,l,u]=cnt(d.id),k=sib(d.id),o=V.o.has(d.id);
 return`<div class="deck" data-a="open" data-id="${d.id}" style="padding-left:${10+dep*16}px">${k.length&&!V.q?`<button class="chev ${o?'o':''}" data-a="tg" data-id="${d.id}" aria-label="Show subdecks">${CH}</button>`:'<i class="chev"></i>'}<span class="name">${esc(d.name)}</span><span class="counts">${zc(n,'n')}${zc(l,'l')}${zc(u,'d')}</span></div>`+(o&&!V.q?k.map(x=>row(x,dep+1)).join(''):'')}
function deckList(){if(!S.decks.length)return`<div class="empty"><p class="mu">No decks yet. Create one to start adding cards.</p><div class="row" style="justify-content:center"><button class="btn p" data-a="nd">New deck</button><button class="btn" data-a="sample">Add sample deck</button></div></div>`;
 const q=V.q.toLowerCase();return q?S.decks.filter(d=>d.name.toLowerCase().includes(q)).map(d=>row(d,0)).join('')||'<div class="empty mu">No decks match.</div>':sib(null).map(d=>row(d,0)).join('')}
const legend='<div class="lg"><span class="n">New</span><span class="l">Learn</span><span class="d">Due</span></div>';
const VIEWS={
 home(){const[n,l,u]=tot(),done=S.logs.filter(x=>x.t>=sod()).length,left=n+l+u,h=new Date().getHours(),sk=streak(),qs=['Ready to sharpen your memory?','A little review today saves hours later.','Small sessions, strong memory.'];
  return`<div style="padding:8px 18px 0;display:flex;flex-direction:column;gap:12px"><div class="card"><h1>Good ${h<12?'morning':h<18?'afternoon':'evening'}!</h1><p class="mu">${qs[new Date().getDate()%3]}</p><p class="mu" style="margin-top:8px">${done}/${S.set.dg} daily goal · ${new Set(S.logs.filter(x=>x.t>Date.now()-7*D).map(x=>dayKey(x.t))).size}/7 days this week</p><div class="pb"><i style="width:${Math.min(100,100*done/S.set.dg)}%"></i></div></div>
  ${PEND?`<div class="card row" style="justify-content:space-between"><span class="mu">Unfinished session · ${PEND.q.length} cards left</span><button class="btn p" data-a="resume">Resume</button></div>`:''}<div class="g2"><div class="stat"><b>${l+u}</b><span>Due today</span></div><div class="stat"><b>${n}</b><span>New cards</span></div></div>
  <button class="big" data-a="study">Start studying <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
  <div class="dw"><div class="dh"><h2>Your decks</h2>${legend}</div><div class="dl" id="dl">${deckList()}</div></div>`},
 decks(){return`<div class="pad"><div class="row"><input data-i="q" placeholder="Search decks" value="${esc(V.q)}" style="flex:1;min-width:140px"><select data-i="sort" style="width:auto"><option value="name"${V.sort=='name'?' selected':''}>A–Z</option><option value="due"${V.sort=='due'?' selected':''}>Most due</option></select></div><div class="row" style="justify-content:space-between"><button class="btn p" data-a="nd">New deck</button>${legend}</div><div class="dl" id="dl" style="flex:none">${deckList()}</div></div>`},
 deck(){const d=deck(V.id);if(!d){V.t='home';return VIEWS.home()}const[n,l,u]=cnt(d.id),ids=new Set(tree(d.id)),all=S.cards.filter(c=>ids.has(c.deck)),tags=[...new Set(all.flatMap(c=>c.tags))].sort(),k=sib(d.id);
  return`<div class="pad"><div class="row"><button class="ib" data-a="go" data-t="decks" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><h1 style="margin:0;font-size:22px;flex:1">${esc(d.name)}</h1></div>
  ${d.desc?`<p class="mu">${esc(d.desc)}</p>`:''}<div class="card row" style="justify-content:space-between"><span class="mu">${all.length} cards</span><span class="counts">${zc(n,'n')}${zc(l,'l')}${zc(u,'d')}</span></div>
  <div class="row"><button class="btn p" data-a="study" data-id="${d.id}">Study</button><button class="btn" data-a="nc" data-id="${d.id}">Add card</button><button class="btn" data-a="nd" data-id="${d.id}">Subdeck</button><button class="btn" data-a="ed" data-id="${d.id}">Edit</button><button class="btn" data-a="dup" data-id="${d.id}">Duplicate</button><button class="btn" data-a="xd" data-id="${d.id}">Export CSV</button><button class="btn r" data-a="dd" data-id="${d.id}">Delete</button></div>
  ${k.length?`<div class="dl" style="flex:none">${k.map(x=>row(x,0)).join('')}</div>`:''}

function cardForm(id,deckId){const c=id?card(id):{};ST_img=[...(c.imgs||[])];modal(`<form data-f="card" data-id="${id||''}"><h2>${id?'Edit card':'New card'}</h2><label>Deck</label><select name="deck">${S.decks.map(d=>`<option value="${d.id}"${d.id==(c.deck||deckId)?' selected':''}>${esc(d.name)}</option>`).join('')}</select><label>Front (question)</label><textarea name="front" data-pv>${esc(c.front)}</textarea><label>Back (answer)</label><textarea name="back" data-pv>${esc(c.back)}</textarea><label>Extra explanation</label><textarea name="extra">${esc(c.extra)}</textarea><label>Hint</label><input name="hint" value="${esc(c.hint)}"><label>Tags (comma separated)</label><input name="tags" value="${esc((c.tags||[]).join(', '))}"><label>Image</label><div class="row"><button type="button" class="btn" data-a="img">Add image</button><button type="button" class="btn" data-a="noimg">Clear images</button><span class="mu" id="is">${ST_img.length?ST_img.length+' image(s)':''}</span></div>${id?'':'<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" name="rev" style="width:auto"> Also create reversed card</label>'}<label>Preview</label><div class="card mu" id="pv" style="white-space:pre-wrap"></div>${btns(id?`<button type="button" class="btn" data-a="dc" data-id="${id}">Duplicate</button><button type="button" class="btn r" data-a="dx" data-id="${id}">Delete</button>`:'')}</form>`);pv()}
let ST_img=[];const pv=()=>{const f=$('form[data-f=card]');if(f)$('#pv').textContent='Q: '+f.front.value+'\nA: '+f.back.value};
function setForm(){modal(`<form data-f="set"><h2>Settings</h2><label>Desired retention (0.70–0.99)</label><input name="ret" type="number" step="0.01" min="0.7" max="0.99" value="${S.set.ret}"><label>New cards per day</label><input name="np" type="number" min="0" value="${S.set.np}"><label>Maximum reviews per day</label><input name="mx" type="number" min="1" value="${S.set.mx}"><label>Daily review goal</label><input name="dg" type="number" min="1" value="${S.set.dg}"><label>Weekly review goal</label><input name="wk" type="number" min="1" value="${S.set.wk}">${btns()}</form>`)}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),t=f.dataset.f,id=f.dataset.id;
 if(t=='mode'){S.set.mode=v.mode;save();cm();startStudy(id||null,v.mode);return}
 if(t=='bmove'){S.cards.forEach(c=>{if(V.sel.has(c.id))c.deck=v.deck});V.sel=null}
 if(t=='rest'){autoBackup();if(v.mode=='replace')S=migrate(window._bk);else{const r=merge(window._bk);alert('Merged: '+r.d+' decks, '+r.c+' cards and '+r.l+' reviews added; '+r.s+' duplicate cards skipped.')}}
 if(t=='deck'){const o={name:v.name.trim(),desc:v.desc.trim(),p:v.p||undefined,np:v.np===''?undefined:+v.np};if(id)Object.assign(deck(id),o);else{const d={id:uid(),...o};S.decks.push(d);if(o.p)V.o.add(o.p)}}
 if(t=='card'){if(v.front&&S.cards.some(c=>c.id!=id&&c.deck==v.deck&&norm(c.front)==norm(v.front))&&!confirm('A card with this front already exists in the deck. Save anyway?'))return;const o={deck:v.deck,front:v.front,back:v.back,extra:v.extra,hint:v.hint,tags:v.tags.split(',').map(x=>x.trim()).filter(Boolean),imgs:ST_img,md:Date.now()};
  if(id)Object.assign(card(id),o);else{S.cards.push(mk(v.deck,o));if(v.rev)S.cards.push(mk(v.deck,{...o,front:v.back,back:v.front,imgs:[]}))}}
 if(t=='set')S.set={...S.set,ret:cl(+v.ret||.9,.7,.99),np:+v.np||0,mx:+v.mx||200,dg:+v.dg||50,wk:+v.wk||300};
 if(t=='imp'){const have=new Set(S.cards.filter(c=>c.deck==v.deck).map(c=>norm(c.front)+'|'+norm(c.back)));let n=0,d=0;window._rows.forEach(r=>{const k=norm(r[0])+'|'+norm(r[1]);if(have.has(k)){d++;return}have.add(k);n++;S.cards.push(mk(v.deck,{front:r[0].trim(),back:r[1].trim(),tags:(r[2]||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean)}))});alert(n+' cards imported, '+d+' duplicates skipped.')}
 save();cm();render()});
document.addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(t.matches('[data-pv]'))pv();if(i=='q'){V.q=t.value;$('#dl').innerHTML=deckList()}if(i=='cq'){V.q=t.value;$('#cl').innerHTML=cardList()}});
document.addEventListener('change',e=>{const t=e.target,i=t.dataset.i;if(i=='sort'){V.sort=t.value;$('#dl').innerHTML=deckList()}if(i=='tag'){V.tag=t.value;$('#cl').innerHTML=cardList()}if(i=='csort'){V.cs=t.value;$('#cl').innerHTML=cardList()}});
// ---------- actions ----------
function dup(id,p){const d=deck(id),n={...d,id:uid(),name:p?d.name:d.name+' (copy)',p:p||d.p};S.decks.push(n);S.cards.filter(c=>c.deck==id).forEach(c=>S.cards.push(mk(n.id,{front:c.front,back:c.back,extra:c.extra,hint:c.hint,tags:[...c.tags],imgs:[...c.imgs]})));kids(id).forEach(k=>dup(k.id,n.id));return n}
const cardsCSV=ids=>toCSV([['front','back','tags'],...S.cards.filter(c=>ids.has(c.deck)).map(c=>[c.front,c.back,c.tags.join(', ')])]);
const A={
 go:b=>go(b.dataset.t),tg:b=>{const i=b.dataset.id;V.o.has(i)?V.o.delete(i):V.o.add(i);render()},open:b=>go('deck',b.dataset.id),set:setForm,
 nd:b=>deckForm(null,b.dataset.id),ed:b=>deckForm(b.dataset.id),nc:b=>S.decks.length?cardForm(null,b.dataset.id):alert('Create a deck first.'),
 ec:b=>cardForm(b.dataset.id),study:b=>modeForm(b.dataset.id),flip:()=>flip(),pause,exit,undo,resume,chk,pk,tf,bsel,ts,sa,bm,bt,bdel,rp(){const p=localStorage.getItem('recall.pre');if(!p)return alert('No pre-restore snapshot found.');if(confirm('Replace current data with the snapshot taken before the last restore?')){S=migrate(JSON.parse(p));save();go('home')}},hint:b=>b.textContent=b.dataset.h,rate:b=>rate(+b.dataset.g),cm:(b,e)=>{if(e.target==b||b.tagName=='BUTTON')cm()},
 sample(){const d={id:uid(),name:'Sample: World capitals'};S.decks.push(d);[['Capital of France?','Paris'],['Capital of Japan?','Tokyo'],['Capital of Australia?','Canberra','Not Sydney']].forEach(c=>S.cards.push(mk(d.id,{front:c[0],back:c[1],extra:c[2]||''})));save();render()},
 dup:b=>{dup(b.dataset.id);save();go('decks')},xd:b=>dl(deck(b.dataset.id).name+'.csv',cardsCSV(new Set(tree(b.dataset.id))),'text/csv'),xa:()=>dl('recall-cards.csv',cardsCSV(new Set(S.decks.map(d=>d.id))),'text/csv'),
 dd(b){const id=b.dataset.id;if(!confirm('Delete this deck, its subdecks and all their cards?'))return;const ids=new Set(tree(id));S.decks=S.decks.filter(d=>!ids.has(d.id));S.cards=S.cards.filter(c=>!ids.has(c.deck));save();go('decks')},
 dc(b){const c=card(b.dataset.id);S.cards.push(mk(c.deck,{front:c.front,back:c.back,extra:c.extra,hint:c.hint,tags:[...c.tags],imgs:[...c.imgs]}));save();cm();render()},
 dx(b){if(confirm('Delete this card?')){S.cards=S.cards.filter(c=>c.id!=b.dataset.id);save();cm();render()}},
 noimg(){ST_img=[];$('#is').textContent=''},
 img(){pick(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ST_img.push(c.toDataURL('image/jpeg',.6));$('#is').textContent=ST_img.length+' image(s)'};im.src=r.result};r.readAsDataURL(f)},'image/*')},
 bk:()=>dl('recall-backup-'+dayKey(Date.now())+'.json',JSON.stringify(S),'application/json'),
 rs:()=>pick(f=>f.text().then(t=>{let j;try{j=JSON.parse(t)}catch(x){return alert('That is not a valid JSON file. Nothing was changed.')}const e=validate(j);if(e)return alert('Backup rejected: '+e+' Nothing was changed.');window._bk=j;
  modal(`<form data-f="rest"><h2>Restore backup</h2><p class="mu">Valid backup: ${j.decks.length} decks, ${j.cards.length} cards, ${(j.logs||[]).length} reviews. Your current data is saved first (a file is downloaded).</p><label>Mode</label><select name="mode"><option value="merge">Merge into current collection (skip duplicates)</option><option value="replace">Replace everything</option></select>${btns().replace('Save','Restore')}</form>`)}),'.json'),
 ic:()=>{if(!S.decks.length)return alert('Create a deck first.');pick(f=>{if(f.size>5e6)return alert('File too large (5 MB max).');f.text().then(t=>{let r=parseCSV(t);if(r.length&&/^(front|question)$/i.test((r[0][0]||'').trim()))r.shift();const ok=r.filter(x=>x.length>=2&&x[0].trim()&&x[1].trim()),bad=r.length-ok.length;if(!ok.length)return alert('No valid rows. Each row needs a front and a back column.');window._rows=ok;
  modal(`<form data-f="imp"><h2>Import ${ok.length} cards</h2><p class="mu">${bad?bad+' malformed row(s) will be skipped. ':''}Cards already in the chosen deck are skipped.</p><label>Into deck</label><select name="deck">${S.decks.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select>${btns().replace('Save','Import')}</form>`)})},'.csv,.tsv,.txt')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){if(b.dataset.a!='cm')e.stopPropagation();A[b.dataset.a](b,e)}});
PEND=loadST();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script>
